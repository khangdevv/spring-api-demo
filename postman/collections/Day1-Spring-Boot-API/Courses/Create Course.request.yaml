$kind: http-request
name: Create Course
method: POST
url: '{{baseUrl}}/courses'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "courseCode": "CS101",
      "courseName": "Introduction to Computer Science",
      "description": "A beginner course in CS",
      "tuitionFee": 500.0,
      "totalSessions": 20,
      "isActive": 1
    }
