$kind: http-request
name: POST /api/posts/:postId/reviews
url: "{{baseUrl}}/api/posts/{{postId}}/reviews"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "rating": 5,
      "comment": "Phong sach se, gia hop ly"
    }
order: 10000
