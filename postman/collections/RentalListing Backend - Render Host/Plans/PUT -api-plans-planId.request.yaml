$kind: http-request
name: PUT /api/plans/:planId
url: "{{baseUrl}}/api/plans/{{planId}}"
method: PUT
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "id": "{{planId}}",
      "displayName": "PRO",
      "priceMonthly": 99000,
      "priceYearly": 990000,
      "maxPosts": 20,
      "maxImages": 10
    }
order: 2000
