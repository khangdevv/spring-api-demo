$kind: http-request
name: POST /api/verifications
url: "{{baseUrl}}/api/verifications"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "idCardFrontPublicId": "front_public_id",
      "idCardBackPublicId": "back_public_id",
      "note": "optional note"
    }
order: 3000
