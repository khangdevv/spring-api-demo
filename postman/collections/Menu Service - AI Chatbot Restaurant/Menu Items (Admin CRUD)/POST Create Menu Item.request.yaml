$kind: http-request
url: "{{base_url}}/api/v1/admin/menu-items"
method: POST
headers:
  x-user-role: "{{admin_role}}"
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Com chien hai san",
      "category": "Mon chinh",
      "description": "Com chien voi tom, muc, ca",
      "price": 89000,
      "ingredients": ["com", "tom", "muc"],
      "tags": ["hot", "best-seller"],
      "is_available": true
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 201', function () {
        pm.response.to.have.status(201);
      });
      const json = pm.response.json();
      if (json && json.id) {
        pm.collectionVariables.set('menu_item_id', json.id);
      }
    language: text/javascript
order: 1000
