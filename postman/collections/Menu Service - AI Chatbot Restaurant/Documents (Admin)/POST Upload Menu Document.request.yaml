$kind: http-request
description: Choose a local .pdf/.docx/.xlsx file in Postman before sending.
url: "{{base_url}}/api/v1/admin/menu/upload"
method: POST
headers:
  x-service-token: "{{service_token}}"
  x-user-role: "{{admin_role}}"
  x-user-id: "{{user_id}}"
  x-trace-id: "{{trace_id}}"
body:
  type: formdata
  content:
    - type: file
      key: file
      src: /C:/Users/baokh/Downloads/Tam/2002240546-Nguyen Luu Bao Tam-KTXS-Nhom5.docx
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 201', function () {
        pm.response.to.have.status(201);
      });
      const json = pm.response.json();
      if (json && json.document_id) {
        pm.collectionVariables.set('document_id', json.document_id);
      }
    language: text/javascript
order: 1000
